<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نور</title>
<style>
:root{--bg:#0f2a26;--cd:#16393a;--ln:#2b5a55;--gd:#d9b66b;--tx:#f1ede2;--mu:#9db8b0;--on:#12302c}
[data-theme=light]{--bg:#f6f1e4;--cd:#fffdf7;--ln:#d9ccaa;--gd:#8a6a1f;--tx:#1d2b28;--mu:#5d6d67;--on:#fffdf7}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;background:var(--bg);color:var(--tx);line-height:2;padding-bottom:76px}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
header{padding:12px;text-align:center;border-bottom:1px solid var(--ln);position:relative}
header h1{font-size:30px;color:var(--gd);line-height:1.4}
#hij{font-size:14px;color:var(--mu)}
#th{position:absolute;right:10px;top:10px;font-size:24px;color:var(--gd)}
main{padding:16px;max-width:560px;margin:auto}
.tab{display:none}.tab.on{display:block}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}
.c{text-align:center}
.g{color:var(--gd)}
.m{color:var(--mu);font-size:14px}
.big{font-size:32px;color:var(--gd)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{border:1px solid var(--ln);color:var(--gd);padding:2px 14px;border-radius:12px;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid button{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:10px;font-size:18px}
.in{width:100%;padding:8px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);font-family:inherit;font-size:18px;margin-bottom:8px}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;padding:6px 2px;border-radius:12px;border:1px solid var(--ln);color:var(--mu);font-size:16px}
.seg button.on{background:var(--gd);color:var(--on);border-color:var(--gd)}
.z p{font-size:20px}
.z.d{opacity:.5}
.tp{background:var(--ln);width:44px;height:44px;border-radius:50%;font-size:18px}
.rd{line-height:2.4;text-align:justify}
.ay{cursor:pointer;border-radius:6px}
.ay.mk{background:rgba(217,182,107,.25)}
.an{color:var(--gd);font-size:.7em}
.ring{width:220px;height:220px;border-radius:50%;margin:16px auto;display:grid;place-items:center;background:conic-gradient(var(--gd) calc(var(--p)*1%),var(--ln) 0);position:relative}
.ring::before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--cd)}
.ring button{position:relative;width:160px;height:160px;border-radius:50%;color:var(--gd);font-size:56px}
.pt{display:flex;justify-content:space-between;background:var(--cd);padding:8px 18px;border-radius:12px;margin-bottom:8px;font-size:20px;border:1px solid transparent}
.pt.nx{border-color:var(--gd)}
.pt b{color:var(--gd);font-weight:400}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--ln)}
nav button{flex:1;padding:6px 0 8px;color:var(--mu);font-size:13px;line-height:1.5}
nav button.on{color:var(--gd)}
nav span{display:block;font-size:20px;line-height:1.4}
</style>
</head>
<body>
<header><button id="th" data-a="th" aria-label="المظهر">◐</button><h1>نُور</h1><div id="hij"></div></header>
<main>
<section id="home" class="tab on">
<div class="cd c"><div id="ay" class="g" style="font-size:24px"></div><div id="ayr" class="m"></div><button class="chip" data-a="ayn">آية أخرى</button></div>
<div class="cd c g" id="hn" hidden></div>
<div id="cont"></div>
<div class="grid">
<button data-a="go" data-v="quran">📖 القرآن</button>
<button data-a="go" data-v="prayer">🕌 الصلاة</button>
<button data-a="zset" data-v="morning">🌅 الصباح</button>
<button data-a="zset" data-v="evening">🌇 المساء</button>
<button data-a="zset" data-v="sleep">🌙 النوم</button>
<button data-a="zset" data-v="duas">🤲 الأدعية</button>
</div>
</section>
<section id="quran" class="tab">
<div id="ql"><input id="qs" class="in" type="search" placeholder="ابحث باسم السورة أو رقمها"><div id="sl"></div></div>
<div id="qr" hidden>
<div class="row"><button class="chip" data-a="qb">رجوع</button><b id="qt"></b><span><button class="chip" data-a="fs" data-v="-2">أ-</button> <button class="chip" data-a="fs" data-v="2">أ+</button></span></div>
<div class="cd rd" id="qx"></div>
<div class="m c">اضغط على أي آية لحفظ موضع قراءتك</div>
<div class="row"><button class="chip" data-a="sn" data-v="-1">السابقة</button><button class="chip" data-a="sn" data-v="1">التالية</button></div>
</div>
</section>
<section id="azkar" class="tab"><div class="seg" id="zs"></div><div id="zl"></div></section>
<section id="tasbih" class="tab c">
<div id="ph" style="font-size:26px"></div>
<div class="ring" id="rg"><button id="tc" data-a="tap">0</button></div>
<div class="m" id="tt"></div>
<div class="row" style="justify-content:center;margin-top:8px"><button class="chip" data-a="tph">تغيير الذكر</button><button class="chip" id="tg" data-a="tg">الهدف</button><button class="chip" data-a="trs">تصفير</button></div>
</section>
<section id="prayer" class="tab">
<div class="cd c"><div id="pnn">الصلاة القادمة</div><div class="big" id="pcd">--:--:--</div></div>
<div id="pl"></div>
<div class="c"><button class="chip" data-a="prl">تحديث المواقيت</button></div>
<div class="m c" id="pnote">تحتاج المواقيت إلى إنترنت وإذن الموقع.</div>
</section>
</main>
<nav>
<button class="on" data-a="go" data-v="home"><span>☪</span>الرئيسية</button>
<button data-a="go" data-v="quran"><span>📖</span>القرآن</button>
<button data-a="go" data-v="azkar"><span>❖</span>الأذكار</button>
<button data-a="go" data-v="tasbih"><span>◉</span>المسبحة</button>
<button data-a="go" data-v="prayer"><span>◷</span>الصلاة</button>
</nav>
<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'.charAt(+d));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const norm=s=>String(s).replace(/[\u0640\u064B-\u065F\u0670\u06D6-\u06ED]/g,'').replace(/[ٱأإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
const dk=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const vib=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
function setTheme(t){document.documentElement.setAttribute('data-theme',t);store.set('theme',t)}
setTheme(store.get('theme','dark'));
function go(id){
document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.id===id));
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===id));
window.scrollTo(0,0);
if(id==='prayer'&&!(PT&&PT.d===dk()))loadPrayer();
}
try{$('hij').textContent=new Intl.DateTimeFormat('ar-SA-u-ca-islamic',{day:'numeric',month:'long',year:'numeric'}).format(new Date())}catch(e){}

/* آية اليوم */
const AY=[["إِنَّ مَعَ الْعُسْرِ يُسْرًا","الشرح: 6"],["أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ","الرعد: 28"],["فَاذْكُرُونِي أَذْكُرْكُمْ","البقرة: 152"],["إِنَّ اللَّهَ مَعَ الصَّابِرِينَ","البقرة: 153"],["حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ","آل عمران: 173"]];
let ai=Math.floor(Date.now()/864e5)%AY.length;
const drawAy=()=>{$('ay').textContent='﴿ '+AY[ai][0]+' ﴾';$('ayr').textContent=AY[ai][1]};

/* القرآن */
const SU="الفاتحة,البقرة,آل عمران,النساء,المائدة,الأنعام,الأعراف,الأنفال,التوبة,يونس,هود,يوسف,الرعد,إبراهيم,الحجر,النحل,الإسراء,الكهف,مريم,طه,الأنبياء,الحج,المؤمنون,النور,الفرقان,الشعراء,النمل,القصص,العنكبوت,الروم,لقمان,السجدة,الأحزاب,سبأ,فاطر,يس,الصافات,ص,الزمر,غافر,فصلت,الشورى,الزخرف,الدخان,الجاثية,الأحقاف,محمد,الفتح,الحجرات,ق,الذاريات,الطور,النجم,القمر,الرحمن,الواقعة,الحديد,المجادلة,الحشر,الممتحنة,الصف,الجمعة,المنافقون,التغابن,الطلاق,التحريم,الملك,القلم,الحاقة,المعارج,نوح,الجن,المزمل,المدثر,القيامة,الإنسان,المرسلات,النبأ,النازعات,عبس,التكوير,الانفطار,المطففين,الانشقاق,البروج,الطارق,الأعلى,الغاشية,الفجر,البلد,الشمس,الليل,الضحى,الشرح,التين,العلق,القدر,البينة,الزلزلة,العاديات,القارعة,التكاثر,العصر,الهمزة,الفيل,قريش,الماعون,الكوثر,الكافرون,النصر,المسد,الإخلاص,الفلق,الناس".split(',');
let cur=0,fs=store.get('fs',26);
function listS(q){
const k=norm(q||'').trim();
$('sl').innerHTML=SU.map((s,i)=>[s,i+1]).filter(x=>!k||norm(x[0]).indexOf(k)>-1||String(x[1])===k).map(x=>'<button class="cd row" style="width:100%;font-size:20px" data-a="so" data-v="'+x[1]+'"><span class="g">'+ar(x[1])+'</span><span>'+x[0]+'</span><span></span></button>').join('');
}
async function getS(n){
let a=store.get('q'+n,null);
if(a&&a.length)return a;
const r=await fetch('https://api.alquran.cloud/v1/surah/'+n+'/quran-uthmani');
if(!r.ok)throw 0;
a=(await r.json()).data.ayahs.map(x=>x.text);
if(!a.length)throw 0;
store.set('q'+n,a);
return a;
}
function drawS(n,a,jump){
const l=a.slice();let b='';
if(n!==1&&n!==9&&norm(l[0]).indexOf('بسم الله الرحمن الرحيم')===0){
l[0]=l[0].split(' ').slice(4).join(' ');
b='<div class="c g">بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ</div>';
}
const L=store.get('last',null);
$('qx').innerHTML=b+l.map((t,i)=>'<span class="ay'+(L&&L.n===n&&L.i===i?' mk':'')+'" data-a="mark" data-v="'+n+':'+i+'">'+esc(t)+' <span class="an">﴿'+ar(i+1)+'﴾</span></span>').join(' ');
const m=$('qx').querySelector('.mk');
if(jump&&m)m.scrollIntoView({block:'center'});else window.scrollTo(0,0);
}
async function openS(n,jump){
if(n<1||n>114)return;
cur=n;$('ql').hidden=true;$('qr').hidden=false;
$('qt').textContent='سورة '+SU[n-1];
$('qx').style.fontSize=fs+'px';
$('qx').textContent='جارٍ التحميل…';
try{const a=await getS(n);if(cur===n)drawS(n,a,jump)}
catch(e){if(cur===n)$('qx').textContent='تعذر التحميل. تحقق من الإنترنت ثم أعد فتح السورة.'}
}
function updCont(){
const L=store.get('last',null);
$('cont').innerHTML=(L&&SU[L.n-1])?'<button class="cd g" style="width:100%" data-a="cont">تابع القراءة: سورة '+SU[L.n-1]+' - آية '+ar(L.i+1)+'</button>':'';
}
$('qs').addEventListener('input',e=>listS(e.target.value));

/* الأذكار والأدعية */
const KU="اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ وَلَا يَئُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ";
const SS="قراءة سور: الإخلاص، الفلق، الناس";
const ZK={
morning:[[KU,1,"آية الكرسي"],[SS,3],["أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ",1],["اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ",1],["سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",100],["أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ",100]],
evening:[[KU,1,"آية الكرسي"],[SS,3],["أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ",1],["اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ",1],["أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ",3],["سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",100]],
sleep:[[KU,1,"آية الكرسي"],[SS,3],["بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا",1],["سُبْحَانَ اللَّهِ (33) • الْحَمْدُ لِلَّهِ (33) • اللَّهُ أَكْبَرُ (34)",1]]
};
const ZL={morning:'الصباح',evening:'المساء',sleep:'النوم',duas:'الأدعية'};
const DU=[["رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ","البقرة: 201"],["رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي","طه: 25-26"],["رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ","الأعراف: 23"],["رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا","الإسراء: 24"],["اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ"],["يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ"]];
let zs='morning';
function renderZ(){
$('zs').innerHTML=Object.keys(ZL).map(k=>'<button data-a="zs" data-v="'+k+'"'+(k===zs?' class="on"':'')+'>'+ZL[k]+'</button>').join('');
if(zs==='duas'){
$('zl').innerHTML=DU.map(d=>'<div class="cd z">'+(d[1]?'<div class="m">'+d[1]+'</div>':'')+'<p>'+d[0]+'</p></div>').join('');
return;
}
const pr=store.get('zp'+dk(),{});
$('zl').innerHTML=ZK[zs].map((z,i)=>{
const n=pr[zs+i]||0,f=n>=z[1];
return '<div class="cd z'+(f?' d':'')+'">'+(z[2]?'<div class="m">'+z[2]+'</div>':'')+'<p>'+z[0]+'</p><div class="row m"><span>'+n+' / '+z[1]+'</span><button class="tp" data-a="zt" data-v="'+i+'">'+(f?'✓':'+')+'</button></div></div>';
}).join('');
}

/* المسبحة */
const PH=["سُبْحَانَ اللَّهِ","الْحَمْدُ لِلَّهِ","اللَّهُ أَكْبَرُ","لَا إِلَهَ إِلَّا اللَّهُ","أَسْتَغْفِرُ اللَّهَ","اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ"],GO=[33,100,0];
let T=store.get('tb',{i:0,c:0,t:0,g:33});
function drawT(){
$('ph').textContent=PH[T.i%PH.length];
$('tc').textContent=T.c;
$('rg').style.setProperty('--p',T.g?(T.c>0&&T.c%T.g===0?100:(T.c%T.g)/T.g*100):0);
$('tt').textContent='المجموع الكلي: '+T.t;
$('tg').textContent=T.g?'الهدف: '+T.g:'بدون هدف';
}

/* مواقيت الصلاة */
const PN=[['Fajr','الفجر'],['Sunrise','الشروق'],['Dhuhr','الظهر'],['Asr','العصر'],['Maghrib','المغرب'],['Isha','العشاء']];
let PT=store.get('pt',null),lastK='';
function tmDate(s,add){
const m=/(\d{1,2}):(\d{2})/.exec(s);if(!m)return null;
const d=new Date();d.setHours(+m[1],+m[2],0,0);if(add)d.setDate(d.getDate()+add);return d;
}
function fmt(s){
const m=/(\d{1,2}):(\d{2})/.exec(s);if(!m)return s;
const h=+m[1];return (h%12||12)+':'+m[2]+' '+(h<12?'ص':'م');
}
function nextP(t){
const now=new Date();
for(let i=0;i<PN.length;i++){
const k=PN[i][0];if(k==='Sunrise')continue;
const d=tmDate(t[k],0);if(d&&d>now)return{k:k,n:PN[i][1],d:d};
}
return{k:'Fajr',n:'الفجر',d:tmDate(t.Fajr,1)};
}
function renderPL(){
if(!PT||!PT.t){$('pl').innerHTML='';return}
let nk='';try{nk=nextP(PT.t).k}catch(e){}
$('pl').innerHTML=PN.map(p=>'<div class="pt'+(p[0]===nk?' nx':'')+'"><span>'+p[1]+'</span><b>'+fmt(PT.t[p[0]])+'</b></div>').join('');
}
function tick(){
if(!PT||!PT.t)return;
let n;try{n=nextP(PT.t)}catch(e){return}
if(!n.d)return;
const s=Math.max(0,Math.floor((n.d-new Date())/1000));
const x=Math.floor(s/3600)+':'+('0'+Math.floor(s%3600/60)).slice(-2)+':'+('0'+(s%60)).slice(-2);
$('pnn').textContent='الصلاة القادمة: '+n.n;$('pcd').textContent=x;
$('hn').hidden=false;$('hn').textContent='الصلاة القادمة: '+n.n+' بعد '+x;
if(n.k!==lastK){lastK=n.k;renderPL()}
}
function loadPrayer(){
const nt=$('pnote');
if(!navigator.geolocation){nt.textContent='الموقع غير مدعوم على هذا الجهاز.';return}
nt.textContent='جارٍ تحديد الموقع…';
navigator.geolocation.getCurrentPosition(async p=>{
try{
const d=new Date();
const u='https://api.aladhan.com/v1/timings/'+d.getDate()+'-'+(d.getMonth()+1)+'-'+d.getFullYear()+'?latitude='+p.coords.latitude+'&longitude='+p.coords.longitude;
const r=await fetch(u);if(!r.ok)throw 0;
const t=(await r.json()).data.timings;
PT={d:dk(),t:{Fajr:t.Fajr,Sunrise:t.Sunrise,Dhuhr:t.Dhuhr,Asr:t.Asr,Maghrib:t.Maghrib,Isha:t.Isha}};
store.set('pt',PT);lastK='';renderPL();tick();nt.textContent='تم التحديث حسب موقعك.';
}catch(e){nt.textContent='تعذر جلب المواقيت. تحقق من الإنترنت.'}
},()=>{nt.textContent='لم يُسمح بالوصول إلى الموقع. فعّل إذن الموقع ثم حدّث.'},{timeout:15000,maximumAge:600000});
}

/* الأوامر */
const A={
go:v=>go(v),
th:()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'),
ayn:()=>{ai=(ai+1)%AY.length;drawAy()},
zset:v=>{go('azkar');zs=v;renderZ()},
zs:v=>{zs=v;renderZ()},
zt:v=>{
const i=+v,z=ZK[zs]&&ZK[zs][i];if(!z)return;
const pr=store.get('zp'+dk(),{}),k=zs+i;
if((pr[k]||0)>=z[1])return;
pr[k]=(pr[k]||0)+1;store.set('zp'+dk(),pr);vib(12);renderZ();
},
tap:()=>{T.c++;T.t++;vib(T.g&&T.c%T.g===0?120:12);store.set('tb',T);drawT()},
tph:()=>{T.i=(T.i+1)%PH.length;T.c=0;store.set('tb',T);drawT()},
tg:()=>{T.g=GO[(GO.indexOf(T.g)+1)%GO.length];store.set('tb',T);drawT()},
trs:()=>{T.c=0;store.set('tb',T);drawT()},
so:v=>openS(+v,false),
qb:()=>{$('qr').hidden=true;$('ql').hidden=false;window.scrollTo(0,0)},
fs:v=>{fs=Math.min(44,Math.max(18,fs+(+v)));store.set('fs',fs);$('qx').style.fontSize=fs+'px'},
sn:v=>openS(cur+(+v),false),
mark:v=>{
const p=v.split(':');store.set('last',{n:+p[0],i:+p[1]});
document.querySelectorAll('.ay.mk').forEach(x=>x.classList.remove('mk'));
const el=document.querySelector('.ay[data-v="'+v+'"]');if(el)el.classList.add('mk');
updCont();
},
cont:()=>{const L=store.get('last',null);if(!L)return;go('quran');openS(L.n,true)},
prl:()=>loadPrayer()
};
document.addEventListener('click',e=>{
const el=e.target.closest('[data-a]');if(!el)return;
const f=A[el.dataset.a];if(f)f(el.dataset.v,el);
});

/* البدء */
drawAy();listS('');renderZ();drawT();updCont();renderPL();tick();
setInterval(tick,1000);
</script>
